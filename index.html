<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TKM · NEW 손익 현황</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0b0b'/%3E%3Crect x='10' y='34' width='11' height='20' rx='2' fill='%231e3a5f'/%3E%3Crect x='26' y='22' width='11' height='32' rx='2' fill='%231e3a5f'/%3E%3Crect x='42' y='12' width='11' height='42' rx='2' fill='%23c2612d'/%3E%3C/svg%3E">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --page:#f8fafc; --surface:#ffffff; --surface-2:#f8fafc;
    --ink:#0f172a; --ink-2:#475569; --muted:#64748b;
    --border:#e2e8f0; --blue:#1e3a5f; --orange:#c2612d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--page);color:var(--ink);
    font-family:"Pretendard Variable","Pretendard",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    font-size:13.5px;line-height:1.45;min-height:100vh;}

  .app-header{background:var(--blue);color:#fff;padding:9px 20px;display:flex;align-items:center;gap:10px;}
  .app-logo{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0;}
  .app-brand-text{display:flex;flex-direction:column;line-height:1.25;}
  .app-brand-text strong{font-size:12.5px;font-weight:700;}
  .app-brand-text span{font-size:10px;opacity:.75;}
  .div-badge{font-size:10px;font-weight:700;background:rgba(255,255,255,.16);padding:2px 8px;
    border-radius:4px;margin-left:2px;letter-spacing:.02em;}

  .wrap{max-width:760px;margin:0 auto;padding:36px 24px;}
  h1{margin:0 0 4px;font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  .sub{margin:0 0 22px;color:var(--muted);font-size:11.5px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:640px){ .cards{grid-template-columns:1fr;} }
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;
    padding:18px 18px;text-decoration:none;color:inherit;display:flex;flex-direction:column;
    gap:7px;transition:border-color .15s, transform .1s;}
  .card:hover{border-color:var(--ink);transform:translateY(-1px);}
  .card-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;}
  .icon-manage{background:var(--blue);}
  .icon-view{background:var(--orange);}
  .card h2{font-size:13.5px;margin:0;}
  .card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.6;}
  .card .go{margin-top:auto;font-size:11px;font-weight:700;color:var(--ink);padding-top:4px;}
  .foot{margin-top:22px;font-size:10.5px;color:var(--muted);line-height:1.6;}
</style>
</head>
<body>

<header class="app-header">
  <span class="app-logo">H</span>
  <div class="app-brand-text">
    <strong>한솔아이원스 안성사업장</strong>
    <span>영업팀 손익 현황 관리 시스템</span>
  </div>
  <span class="div-badge">TKM · NEW</span>
</header>

<div class="wrap">
  <h1>손익 현황</h1>
  <p class="sub">역할에 맞는 화면을 선택하세요.</p>

  <div class="cards">
    <a class="card" href="manage.html">
      <div class="card-icon icon-manage">＋</div>
      <h2>자료 준비</h2>
      <p>월별 손익현황 엑셀을 업로드해서 현황을 확인하고, 확정되면 버전으로 저장합니다.</p>
      <div class="go">시작하기 →</div>
    </a>
    <a class="card" href="list.html" id="viewCard">
      <div class="card-icon icon-view">▤</div>
      <h2>자료 열람</h2>
      <p>계정으로 로그인 후, 저장된 버전 목록에서 시점을 선택해 확인합니다.</p>
      <div class="go">버전 목록 열기 →</div>
    </a>
  </div>

  <p class="foot">사내 참고용 · 외부 공개 전 보안 검토 필요. 저장된 버전은 계정으로 로그인해야만 열람·저장할 수 있습니다.</p>
</div>
