<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손익 현황 버전 열람</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0b0b'/%3E%3Crect x='10' y='34' width='11' height='20' rx='2' fill='%231e3a5f'/%3E%3Crect x='26' y='22' width='11' height='32' rx='2' fill='%231e3a5f'/%3E%3Crect x='42' y='12' width='11' height='42' rx='2' fill='%23c2612d'/%3E%3C/svg%3E">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
  :root{
    --page:radial-gradient(1100px 520px at 10% -10%, rgba(60,163,249,.08), transparent 60%),
      linear-gradient(180deg, #f8f9fc 0%, #edf0f6 100%);
    --surface:#ffffff; --surface-2:#f7f8fd;
    --ink:#1c2333; --ink-2:#5b6478; --muted:#8890a3;
    --border:#e7e9f4; --blue:#3b6fe0; --orange:#14b8a6;
    --accent1:#3ca3f9; --accent2:#3b6fe0; --shadow:0 2px 14px rgba(45,55,110,.07);
    --new-tint:#eef2fd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--page);color:var(--ink);
    font-family:"Pretendard Variable","Pretendard",system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
    font-size:13.5px;line-height:1.45;min-height:100vh;}

  .app-header{background:var(--surface);color:var(--ink);padding:12px 24px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--border);}
  .app-logo{width:28px;height:28px;border-radius:8px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0;color:#fff;}
  .app-brand-text{display:flex;flex-direction:column;line-height:1.25;}
  .app-brand-text strong{font-size:13px;font-weight:800;letter-spacing:-0.01em;}
  .app-brand-text span{font-size:10px;color:var(--muted);}
  .div-badge{font-size:10px;font-weight:700;background:var(--new-tint);color:var(--accent2);padding:3px 9px;
    border-radius:999px;margin-left:2px;letter-spacing:.02em;}

  .wrap{max-width:1000px;margin:0 auto;padding:28px 28px;}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  h1{margin:0 0 4px;font-size:16px;font-weight:700;}
  .sub{margin:0;color:var(--muted);font-size:11.5px;}
  .btn-create{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;
    text-decoration:none;font-size:13px;font-weight:700;padding:10px 16px;border-radius:8px;white-space:nowrap;
    transition:filter .12s;}
  .btn-create:hover{filter:brightness(0.92);}

  .version-list{display:flex;flex-direction:column;gap:7px;}
  .version-item{position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:11px 68px 11px 14px;transition:box-shadow .15s;box-shadow:var(--shadow);}
  .version-item:hover{box-shadow:0 4px 18px rgba(45,55,110,.11);}
  .item-link{position:absolute;inset:0;z-index:1;}
  .version-main{position:relative;}
  .version-main strong{font-size:14px;font-weight:800;}
  .version-meta{font-size:11px;color:var(--muted);margin-top:3px;}
  .empty-note, .loading-note{padding:30px 0;text-align:center;color:var(--muted);font-size:12px;}

  .latest-card{position:relative;background:linear-gradient(180deg,#f0eefc,#ffffff);
    border:1.5px solid var(--accent1);border-radius:14px;padding:16px 68px 16px 18px;margin-bottom:16px;
    box-shadow:0 4px 20px rgba(60,163,249,.12);transition:box-shadow .12s;}
  .latest-card:hover{box-shadow:0 8px 26px rgba(60,163,249,.18);}
  .latest-badge{display:inline-flex;align-items:center;gap:3px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;
    font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:2px 9px;border-radius:999px;margin-bottom:7px;}
  .latest-period{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-0.01em;}
  .latest-meta{font-size:11.5px;color:var(--ink-2);margin-top:4px;}
  .older-heading{font-size:11.5px;font-weight:700;color:var(--muted);margin:4px 0 8px;}

  .item-icons{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;gap:4px;}
  .icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);padding:0;}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink);}
  .icon-btn.fix-btn.active{color:#c98a1f;border-color:#c98a1f;background:#fffbeb;}
  .icon-btn.del-btn:hover{color:#e0526b;border-color:#e0526b;background:#fdf1f3;}
  .icon-btn svg{width:15px;height:15px;}

</style>
</head>
<body>

<header class="app-header">
  <span class="app-logo">H</span>
  <div class="app-brand-text">
    <strong>한솔아이원스 안성사업장</strong>
    <span>영업팀 손익 현황 관리 시스템</span>
  </div>
  <span class="div-badge">TKM · NEW</span>
</header>

<div class="wrap">
  <div class="page-head">
    <div>
      <h1>손익 현황 버전 열람</h1>
      <p class="sub">저장된 시점 순서대로 정렬됩니다. 확인할 버전을 선택하세요.</p>
    </div>
    <a class="btn-create" href="manage.html">+ 보고서 생성</a>
  </div>
  <div class="version-list" id="versionList">
    <div class="loading-note">불러오는 중...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
var ICON_STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.9-6.3 3.9 1.7-7-5.4-4.7 7.1-.6z"/></svg>';
var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

function periodOf(d){ return (d.monthFrom||"") + "~" + (d.monthTo||""); }
function savedAtOf(d){ return d.savedAt ? new Date(d.savedAt).toLocaleString("ko-KR") : ""; }

function iconsHtml(id, fixed){
  return '<div class="item-icons">'+
    '<button type="button" class="icon-btn fix-btn'+(fixed?' active':'')+'" data-id="'+id+'" data-fixed="'+(fixed?1:0)+'" title="고정 표시">'+ICON_STAR+'</button>'+
    '<button type="button" class="icon-btn del-btn" data-id="'+id+'" title="삭제">'+ICON_TRASH+'</button>'+
    '</div>';
}

/* 목록은 가벼운 메타(versionsMeta)만 읽는다 — 실제 데이터(versionsData)는
   특정 버전을 열 때(view.html)만 읽는다. */
function loadVersionList(){
  var listEl = document.getElementById("versionList");
  listEl.innerHTML = '<div class="loading-note">불러오는 중...</div>';
  dashRef("versionsMeta").orderByChild("savedAt").limitToLast(50).once("value").then(function(snap){
    if (!snap.exists()){
      listEl.innerHTML = '<div class="empty-note">아직 저장된 버전이 없습니다. "보고서 생성"에서 먼저 저장해주세요.</div>';
      return;
    }
    var items = [];
    snap.forEach(function(child){ items.push({ id: child.key, data: child.val() }); });
    items.reverse(); // limitToLast는 오래된 순으로 오므로 최신순으로 뒤집기

    var latest = items[0];
    var ld = latest.data;
    var html = '<div class="latest-card">'+
      '<a class="item-link" href="view.html?v='+latest.id+'"></a>'+
      '<div class="version-main"><span class="latest-badge">최신 버전</span>'+
      '<div class="latest-period">저장 '+savedAtOf(ld)+'</div>'+
      '<div class="latest-meta">데이터 기준일 '+periodOf(ld)+' · '+(ld.createdBy||"")+' · '+(ld.rowCount||0).toLocaleString()+'행</div></div>'+
      iconsHtml(latest.id, ld.fixed)+'</div>';

    var rest = items.slice(1);
    if (rest.length){
      html += '<div class="older-heading">이전 버전 ('+rest.length+'개)</div>';
      html += rest.map(function(it){
        var d = it.data;
        return '<div class="version-item">'+
          '<a class="item-link" href="view.html?v='+it.id+'"></a>'+
          '<div class="version-main"><strong>저장 '+savedAtOf(d)+'</strong>'+
          '<div class="version-meta">데이터 기준일 '+periodOf(d)+' · '+(d.createdBy||"")+' · '+(d.rowCount||0).toLocaleString()+'행</div></div>'+
          iconsHtml(it.id, d.fixed)+'</div>';
      }).join("");
    }
    listEl.innerHTML = html;

    listEl.querySelectorAll(".fix-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var nowFixed = btn.getAttribute("data-fixed") === "1";
        btn.disabled = true;
        dashRef("versionsMeta/"+id+"/fixed").set(!nowFixed).then(loadVersionList).catch(function(err){
          alert("고정 표시 변경 실패: "+err.message);
          btn.disabled = false;
        });
      });
    });
    listEl.querySelectorAll(".del-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        if (!confirm("이 버전을 삭제할까요? 되돌릴 수 없습니다.")) return;
        btn.disabled = true;
        Promise.all([
          dashRef("versionsMeta/"+id).remove(),
          dashRef("versionsData/"+id).remove()
        ]).then(loadVersionList).catch(function(err){
          alert("삭제 실패: "+err.message);
          btn.disabled = false;
        });
      });
    });
  }).catch(function(err){
    listEl.innerHTML = '<div class="empty-note">목록을 불러오지 못했습니다: '+err.message+'</div>';
  });
}

window.addEventListener("DOMContentLoaded", function(){
  appGate(loadVersionList);
});
</script>
</body>
</html>
